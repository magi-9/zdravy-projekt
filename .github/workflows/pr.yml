name: Pull Request Checks

on:
  pull_request:
    branches: [main, develop]
    # release-please PR mení len tieto — žiadny reálny kód, ktorý by ešte
    # neprešiel CI na develop -> main PR. Vynecháme ich, nech sa checky
    # nespúšťajú znova zbytočne.
    paths-ignore:
      - VERSION
      - frontend/package.json
      - CHANGELOG.md
      - .release-please-manifest.json

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: self-hosted
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      database: ${{ steps.filter.outputs.database }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'compose/**'
              - 'scripts/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - 'compose/**'
              - '.github/workflows/**'
            docker:
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - 'compose/**'
              - '.github/workflows/**'
            database:
              - 'backend/api/migrations/**'
              - 'backend/api/models.py'
              - 'backend/app/settings/**'
              - 'compose/**'

  # Definovaný ako prvý a bez `needs` — je to zvyčajne najdlhší beh (image
  # build), tak nech ho runner zoberie hneď, paralelne s lintom/testami,
  # namiesto toho, aby na ne čakal a predĺžil celkový čas PR checkov.
  docker-build-backend:
    name: Docker Build Test
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.docker == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: zdravy-projekt-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-frontend:
    name: Frontend Docker Build Test
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docker == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: zdravy-projekt-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend-lint:
    name: Backend Lint
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        working-directory: ./backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check formatting with black
        working-directory: ./backend
        run: black --check .

      - name: Check imports with isort
        working-directory: ./backend
        run: isort --check-only .

      - name: Type check with mypy
        working-directory: ./backend
        run: mypy api --ignore-missing-imports

  frontend-lint:
    name: Frontend Lint
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

  backend-tests:
    name: Backend Unit Tests
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432/tcp

      # Bez Redisu spadne `CACHES` na LocMem a cachovanie `/admin/celky/` ticho
      # nefunguje — testy k nemu potom padajú na niečom, čo v produkcii nie je.
      # Prostredie testov má sedieť s produkciou, kde Redis beží.
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379/tcp

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      # Tento job beží priamo na runneri, nie v image z Dockerfile. WeasyPrint
      # (gramáž PDF) je tenká väzba nad Pangom — import prejde aj bez neho, ale
      # prvý render spadne na `cannot load library 'libpango-1.0-0'`. Runner
      # preto musí mať nainštalované:
      #   libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      #   libgdk-pixbuf-2.0-0 libffi8 fonts-dejavu-core
      # Krokom to nejde — `sudo` na runneri žiada heslo.
      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: app.settings.dev
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
        run: |
          pytest --no-cov

      - name: Test contract migrations
        if: needs.changes.outputs.database == 'true'
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: app.settings.dev
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
        run: |
          pytest --migrations --create-db -m migration tests/test_legacy_contract_migration.py --no-cov

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests
        working-directory: ./frontend
        run: npm run test

  pr-verified:
    name: PR verified
    runs-on: self-hosted
    needs:
      - changes
      - docker-build-backend
      - docker-build-frontend
      - backend-lint
      - frontend-lint
      - backend-tests
      - frontend-tests
    if: always()
    steps:
      - name: Require every relevant check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Results: $RESULTS"
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*) exit 1 ;;
          esac
