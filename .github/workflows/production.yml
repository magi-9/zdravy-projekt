name: Build And Deploy Production Images

on:
  push:
    # Release Please creates this tag only after its version-bump commit is
    # on main.  Building the tag therefore bakes the same version that is in
    # the GitHub Release into the frontend image.
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-images
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Production Images
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.REGISTRY_USERNAME }}/zdravy-projekt-backend:prod-${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.PROD_VITE_API_URL || '/api' }}
          tags: |
            ${{ secrets.REGISTRY_USERNAME }}/zdravy-projekt-frontend:prod-${{ github.sha }}

      - name: Print rollback tags
        run: |
          echo "Production image tag: prod-${{ github.sha }}"
          echo "GitHub Actions will set Dokploy PROD_IMAGE_TAG=prod-${{ github.sha }} before deploying compose/prod.yml"
          echo "The production workflow intentionally does not push the mutable :prod tag."

      - name: Deploy through Dokploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          PROD_IMAGE_TAG: prod-${{ github.sha }}
        run: scripts/deploy-production-dokploy.py

  load-smoke:
    name: Order Submit Load Smoke
    runs-on: self-hosted
    needs: build-and-push
    # Jeden jediný automatický load smoke: až keď bol release tag reálne
    # nasadený. Nevykonáva sa pre PR ani ešte raz pri pushi na main.
    steps:
      - name: Checkout released source
        uses: actions/checkout@v6

      - name: Run Docker dev k6 smoke test
        env:
          USER_COUNT: "3"
          MAX_SUBMITS: "3"
          RATE: "6"
          DURATION: "30s"
          PRE_ALLOCATED_VUS: "2"
          MAX_VUS: "6"
          USER_EMAIL_DOMAIN: "ci.loadtest.local"
          PASSWORD: "LoadTestPassword123!"
          COMPOSE_FILE: "compose/load-test-ci.yml"
          COMPOSE_PROJECT_NAME: "zp-load-${{ github.run_id }}-${{ github.run_attempt }}"
          BASE_URL: "http://backend:8000"
          HEALTHCHECK_MODE: "backend"
          K6_NETWORK: "compose"
          STOP_STACK_AFTER: "true"
        run: scripts/run-order-load-test.sh
