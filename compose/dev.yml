services:
  db:
    # #506 — PostgreSQL 18 vyžaduje nový volume po veľkom upgrade z 15.
    # Bežný `./rebuild-dev.sh` ho však zachováva; zmazať ho smie len explicitné
    # `./rebuild-dev.sh --reset-db`.
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zdravy_projekt_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      # 18+ images store data one level up (pg_ctlcluster-style, versioned
      # subdir under here) — mounting straight at .../data like the old 15
      # image did makes the entrypoint refuse to start (see docker-library/
      # postgres#1259). Needs the fresh volume from the #506 comment above.
      - postgres_data_dev:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1026:1025"  # SMTP
      - "8026:8025"  # Web UI
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    # Lokálny klon produkcie nesmie pri štarte meniť referenčné dáta, prevádzky,
    # objednávky ani periodic tasks. `init_roles` ponechávame výhradne pre
    # fast-access demo loginy; je idempotentný a nemení produkčné záznamy.
    command: sh -c "python manage.py migrate && python manage.py init_roles --fast-access-only && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.dev
      POSTGRES_DB: ${POSTGRES_DB:-zdravy_projekt_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-BPWWCgQ8JraWheFRIUrMpzw2KgnXj3qXSTLmb1wi9o1lj1ofI6LCidmXcc3xb072BmmOfgQijCuqQG0tn5UwjY4}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-Puur0QT5cW1ev5w_XDuAifu5jNJQy7nwWdsMdLdBV38}
      VAPID_ADMIN_EMAIL: ${VAPID_ADMIN_EMAIL:-admin@example.com}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    stdin_open: true
    tty: true

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app worker -l info
    volumes:
      - ../backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.dev
      POSTGRES_DB: ${POSTGRES_DB:-zdravy_projekt_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      disable: true

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ../backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.dev
      POSTGRES_DB: ${POSTGRES_DB:-zdravy_projekt_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: on-failure
    healthcheck:
      disable: true

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: builder
    command: npm run dev
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_DEV_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  postgres_data_dev:
