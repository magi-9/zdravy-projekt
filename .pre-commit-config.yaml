# Verzie musia sedieť s `backend/requirements.txt` — CI púšťa nástroje odtiaľ.
# Keď sa rozídu, hook lokálne prejde a CI na tom istom kóde padne (stalo sa
# pri PR #501: black 25.1.0 vs 26.3.1 formátujú inak).
#
# `commit-msg` hook (nižšie) potrebuje aj stage `commit-msg`, nielen
# predvolený `pre-commit` — `default_install_hook_types` zariadi, že obyčajné
# `pre-commit install` (README) nainštaluje oba.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        name: black (backend)
        files: ^backend/
        language_version: python3.12

  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        name: isort (backend)
        files: ^backend/
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: flake8 (backend)
        files: ^backend/
        args: ["--config=backend/.flake8"]

  - repo: local
    hooks:
      - id: mypy-backend
        name: mypy (backend)
        entry: bash -c 'cd backend && if [ -x ./.venv/bin/mypy ]; then ./.venv/bin/mypy api --ignore-missing-imports --config-file=mypy.ini; else mypy api --ignore-missing-imports --config-file=mypy.ini; fi'
        language: system
        pass_filenames: false
      - id: gramage-css-sync
        name: gramage-table.css sync (backend ↔ frontend)
        entry: bash -c 'diff -q backend/api/exporters/assets/gramage-table.css frontend/src/pages/admin/gramage-table.css || { echo "gramage-table.css sa rozišiel — obrazovka a PDF by vyzerali inak. Skopíruj jednu kópiu na druhú."; exit 1; }'
        language: system
        pass_filenames: false
        files: gramage-table\.css$
      - id: commit-msg-format
        name: commit message (Conventional Commits)
        entry: scripts/check-commit-msg.sh
        language: system
        stages: [commit-msg]
